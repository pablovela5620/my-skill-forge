[workspace]
channels = ["conda-forge"]
name = "my-skill-forge"
platforms = ["osx-arm64", "linux-64"]

[tasks]
pre-commit-install = "pre-commit install"
lint = "pre-commit run -a --color=always --show-diff-on-failure"
test = "pytest tests"
check = { depends-on = ["lint", "test"] }
build = { cmd = "rattler-build build -c https://prefix.dev/my-skill-forge -c conda-forge --recipe recipes/{{ skill }}", args = [
  "skill",
] }
build-new = "rattler-build build -c https://prefix.dev/my-skill-forge -c conda-forge --recipe-dir recipes/ --skip-existing=all"
build-all = "rattler-build build -c https://prefix.dev/my-skill-forge -c conda-forge --recipe-dir recipes/"
autobump = ".github/scripts/update.sh"

[dependencies]
ca-certificates = ">=2026.10.19"
go-yq = "*"
rattler-build = ">=0.58.4,<0.59"
pre-commit = "*"
pre-commit-hooks = "*"
pytest = "*"
python = "3.13.*"
taplo = "*"
typos = "*"
zizmor = "*"
