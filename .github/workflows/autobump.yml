name: Autobump
on:
  workflow_dispatch:
    inputs:
      skill:
        description: Skill to bump. Leave empty to check every skill.
        required: false
        default: ""
  schedule:
    - cron: "0 5 * * *"

# A manual run waits for the scheduled one instead of racing it on the same
# bump-<skill> branch.
concurrency:
  group: autobump
  cancel-in-progress: false

# Per skill: bump the recipe, keep one PR on bump-<skill> updated in place,
# build and test the package, and record the result as a commit status on the
# PR. Upstream content is untrusted: Autobump never merges. Pablo merges after
# reading the upstream diff and the daily review comment; the merge's push to
# main runs Package, which publishes. GITHUB_TOKEN pushes start no workflows,
# so the commit status is the only CI evidence a bump PR carries.
jobs:
  bump:
    strategy:
      fail-fast: false
      matrix:
        include:
          - skill: paseo
            strategy: git-main
          - skill: paseo-help
            strategy: git-main
          - skill: investigate-puffin
            strategy: git-main
          - skill: rerun-blueprint
            strategy: git-main
          - skill: rerun-catalog-queries
            strategy: git-main
          - skill: rerun-chunk-processing
            strategy: git-main
          - skill: rerun-data-model
            strategy: git-main
          - skill: rerun-dataset-conversion
            strategy: git-main
          - skill: rerun-docs
            strategy: git-main
          - skill: rerun-lerobot
            strategy: git-main
          - skill: rerun-mcap
            strategy: git-main
          - skill: rerun-mp4
            strategy: git-main
          - skill: rerun-parquet
            strategy: git-main
          - skill: rerun-robot-model
            strategy: git-main
          - skill: art-of-debugging
            strategy: git-main
          - skill: batch-grill-me
            strategy: git-main
          - skill: domain-modeling
            strategy: git-main
          - skill: gh-cli
            strategy: git-main
          - skill: grilling
            strategy: git-main
          - skill: retro
            strategy: git-main
          - skill: writing-for-agents
            strategy: git-main
          - skill: handoff
            strategy: git-main
          - skill: hf-cli
            strategy: git-main
          - skill: karpathy-guidelines
            strategy: git-main
          - skill: playwright-cli
            strategy: git-main
          - skill: port-model
            strategy: git-main
          - skill: simplify-code
            strategy: git-main
          - skill: svelte-code-writer
            strategy: git-main
          - skill: svelte-core-bestpractices
            strategy: git-main
          - skill: tailscale
            strategy: git-main
          - skill: tdd
            strategy: git-main
          - skill: teach
            strategy: git-main
          - skill: thermo-nuclear-code-quality-review
            strategy: git-main
    name: Bump ${{ matrix.skill }}
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch package.yml
      contents: write # push bump-<skill>
      pull-requests: write
      statuses: write # record the build-and-test result on the PR head
    env:
      GH_TOKEN: ${{ github.token }}
      SKILL: ${{ matrix.skill }}
      STRATEGY: ${{ matrix.strategy }}
      SELECTED: ${{ github.event_name == 'schedule' || inputs.skill == '' || inputs.skill == matrix.skill }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: env.SELECTED == 'true'

      - name: Set up Pixi
        if: env.SELECTED == 'true'
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6

      - name: Bump recipe
        if: env.SELECTED == 'true'
        id: bump
        run: pixi run autobump "$SKILL" "$STRATEGY"

      - name: Open or update the pull request
        if: env.SELECTED == 'true' && steps.bump.outputs.old-version != steps.bump.outputs.new-version
        id: pr
        env:
          OLD: ${{ steps.bump.outputs.old-version }}
          NEW: ${{ steps.bump.outputs.new-version }}
          COMPARE_URL: ${{ steps.bump.outputs.compare-url }}
          UPSTREAM_PATH: ${{ steps.bump.outputs.upstream-path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="bump-$SKILL"
          title="Bump $SKILL from $OLD to $NEW"
          body="Strategy: \`$STRATEGY\`. [Autobump]($RUN_URL) built and tested this package; the \`autobump/build-and-test\` status shows the result.

          **Upstream changes:** ${COMPARE_URL:-see the upstream release notes}${UPSTREAM_PATH:+ (packaged folder: \`$UPSTREAM_PATH\`)}

          Upstream content is untrusted. Read the diff, and the daily review comment, before merging; changed scripts matter most. Merging publishes the package."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -am "$title"
          git push --force origin "$branch"
          url=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [[ -n "$url" ]]; then
            gh pr edit "$url" --title "$title" --body "$body"
          else
            url=$(gh pr create --base main --head "$branch" --title "$title" --body "$body")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and test the package
        if: steps.pr.outputs.url
        id: build
        run: pixi run build "$SKILL"

      - name: Record the result on the pull request
        if: always() && steps.pr.outputs.url
        env:
          SHA: ${{ steps.pr.outputs.sha }}
          RESULT: ${{ steps.build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=$([[ "$RESULT" == success ]] && echo success || echo failure)
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" \
            -f context=autobump/build-and-test -f target_url="$RUN_URL" \
            -f description="pixi run build $SKILL: $RESULT" >/dev/null
