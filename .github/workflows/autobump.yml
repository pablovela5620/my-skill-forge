name: Autobump
on:
  workflow_dispatch:
    inputs:
      skill:
        description: Skill to bump.
        required: true
  schedule:
    - cron: "0 5 * * *"

jobs:
  bump:
    strategy:
      fail-fast: false
      matrix:
        include:
          - skill: chrome-cdp
            strategy: github-latest-release
          # git-main strategy (track main branch)
          - skill: art-of-debugging
            strategy: git-main
          - skill: batch-grill-me
            strategy: git-main
          - skill: daggr
            strategy: git-main
          - skill: domain-modeling
            strategy: git-main
          - skill: gh-cli
            strategy: git-main
          # grill-me and grill-with-docs are intentionally frozen at 0.0.2:
          # upstream turned them into disable-model-invocation alias stubs that
          # fail `agentskills validate`. Superseded by grilling + domain-modeling.
          - skill: grilling
            strategy: git-main
          - skill: hf-cli
            strategy: git-main
          - skill: karpathy-guidelines
            strategy: git-main
          - skill: playwright-cli
            strategy: git-main
          - skill: port-model
            strategy: git-main
          - skill: simplify-code
            strategy: git-main
          - skill: tdd
            strategy: git-main
          - skill: teach
            strategy: git-main
          - skill: thermo-nuclear-code-quality-review
            strategy: git-main
    name: Bump ${{ matrix.skill }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: github.event_name == 'schedule' || github.event.inputs.skill == matrix.skill

      - name: Set up Pixi
        if: github.event_name == 'schedule' || github.event.inputs.skill == matrix.skill
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6

      - name: Bump version
        if: github.event_name == 'schedule' || github.event.inputs.skill == matrix.skill
        run: pixi run autobump ${{ matrix.skill }} ${{ matrix.strategy }}
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create Pull Request
        if: (github.event_name == 'schedule' || github.event.inputs.skill == matrix.skill) && steps.bump.outputs.old-version != steps.bump.outputs.new-version
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ github.token }}
          title: Bump ${{ matrix.skill }} from ${{ steps.bump.outputs.old-version }} to ${{ steps.bump.outputs.new-version }}
          commit-message: Bump ${{ matrix.skill }} from ${{ steps.bump.outputs.old-version }} to ${{ steps.bump.outputs.new-version }}
          branch: bump-${{ matrix.skill }}
          delete-branch: true
          body: |
            # ${{ matrix.skill }}

            `${{ steps.bump.outputs.old-version }}` -> `${{ steps.bump.outputs.new-version }}`

            Strategy: `${{ matrix.strategy }}`
