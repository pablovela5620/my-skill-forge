name: Autobump
on:
  workflow_dispatch:
    inputs:
      skill:
        description: Skill to bump. Leave empty to check every skill.
        required: false
        default: ""
  schedule:
    - cron: "0 5 * * *"

# Jobs merge into main; a manual run waits for the scheduled one instead of
# racing it on the same bump-<skill> branch.
concurrency:
  group: autobump
  cancel-in-progress: false

# Per skill: bump the recipe, keep one PR on bump-<skill> updated in place,
# build and test the package, merge, then dispatch Package to publish.
# GITHUB_TOKEN events do not start workflows, so this job is the only gate
# a bump passes; Package runs only because it is dispatched explicitly.
jobs:
  bump:
    strategy:
      fail-fast: false
      matrix:
        include:
          - skill: chrome-cdp
            strategy: github-latest-release
          - skill: paseo
            strategy: git-main
          - skill: paseo-help
            strategy: git-main
          - skill: investigate-puffin
            strategy: git-main
          - skill: rerun-blueprint
            strategy: git-main
          - skill: rerun-catalog-queries
            strategy: git-main
          - skill: rerun-chunk-processing
            strategy: git-main
          - skill: rerun-data-model
            strategy: git-main
          - skill: rerun-dataset-conversion
            strategy: git-main
          - skill: rerun-docs
            strategy: git-main
          - skill: rerun-lerobot
            strategy: git-main
          - skill: rerun-mcap
            strategy: git-main
          - skill: rerun-mp4
            strategy: git-main
          - skill: rerun-parquet
            strategy: git-main
          - skill: rerun-urdf
            strategy: git-main
          - skill: art-of-debugging
            strategy: git-main
          - skill: batch-grill-me
            strategy: git-main
          - skill: daggr
            strategy: git-main
          - skill: domain-modeling
            strategy: git-main
          - skill: gh-cli
            strategy: git-main
          - skill: grilling
            strategy: git-main
          - skill: handoff
            strategy: git-main
          - skill: hf-cli
            strategy: git-main
          - skill: karpathy-guidelines
            strategy: git-main
          - skill: playwright-cli
            strategy: git-main
          - skill: port-model
            strategy: git-main
          - skill: simplify-code
            strategy: git-main
          - skill: tailscale
            strategy: git-main
          - skill: tdd
            strategy: git-main
          - skill: teach
            strategy: git-main
          - skill: thermo-nuclear-code-quality-review
            strategy: git-main
    name: Bump ${{ matrix.skill }}
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch package.yml
      contents: write # push bump-<skill> and merge
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      SKILL: ${{ matrix.skill }}
      STRATEGY: ${{ matrix.strategy }}
      SELECTED: ${{ github.event_name == 'schedule' || inputs.skill == '' || inputs.skill == matrix.skill }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: env.SELECTED == 'true'

      - name: Set up Pixi
        if: env.SELECTED == 'true'
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6

      - name: Bump recipe
        if: env.SELECTED == 'true'
        id: bump
        run: pixi run autobump "$SKILL" "$STRATEGY"

      - name: Open or update the pull request
        if: env.SELECTED == 'true' && steps.bump.outputs.old-version != steps.bump.outputs.new-version
        id: pr
        env:
          OLD: ${{ steps.bump.outputs.old-version }}
          NEW: ${{ steps.bump.outputs.new-version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="bump-$SKILL"
          title="Bump $SKILL from $OLD to $NEW"
          body="Strategy: \`$STRATEGY\`. [Autobump]($RUN_URL) builds and tests this package, merges it, and dispatches Package to publish."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -am "$title"
          git push --force origin "$branch"
          url=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [[ -n "$url" ]]; then
            gh pr edit "$url" --title "$title" --body "$body"
          else
            url=$(gh pr create --base main --head "$branch" --title "$title" --body "$body")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build and test the package
        if: steps.pr.outputs.url
        run: pixi run build "$SKILL"

      - name: Merge and publish
        if: steps.pr.outputs.url
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          # Parallel jobs merging at once can briefly refuse a merge; retry.
          for attempt in 1 2 3; do
            gh pr merge "$PR_URL" --repo "$GITHUB_REPOSITORY" --squash --delete-branch && break
            [[ $attempt == 3 ]] && exit 1
            sleep 15
          done
          gh workflow run package.yml --ref main
