context:
  skill: grilling
  upstream_path: skills/productivity/grilling
package:
  name: agent-skill-${{ skill }}
  version: "0.0.2"
source:
  git: https://github.com/mattpocock/skills
  rev: 85f83d3fde1d3a90d5c9a657f6998c79a6c37308
build:
  number: 0
  noarch: generic
  script:
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}
    - cp -R ${{ upstream_path }}/* $PREFIX/share/agent-skills/${{ skill }}
tests:
  - package_contents:
      files:
        - share/agent-skills/${{ skill }}/SKILL.md
      strict: true
  - script:
      - agentskills validate $CONDA_PREFIX/share/agent-skills/${{ skill }}
    requirements:
      run:
        - skills-ref
about:
  summary: Agent skill for stress-testing plans with relentless questions
  description: |
    Productivity skill that drives a focused planning interview:
    - Stress-tests plans and designs before execution
    - Walks decision branches one question at a time
    - Recommends an answer for every question while converging on shared understanding
  homepage: https://github.com/mattpocock/skills/tree/main/skills/productivity/grilling
  repository: https://github.com/mattpocock/skills
  documentation: https://github.com/mattpocock/skills/tree/main/skills/productivity/grilling
  license: MIT
  license_file: LICENSE
