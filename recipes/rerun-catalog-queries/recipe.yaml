context:
  skill: rerun-catalog-queries
  upstream_path: skills/rerun-catalog-queries

package:
  name: agent-skill-${{ skill }}
  version: "0.0.1"

source:
  git: https://github.com/rerun-io/rerun
  rev: 79b328a35b5a4eab7c30e2ea0ab4d4ea11dc0b86
  patches:
    - packaging.patch

build:
  number: 0
  noarch: generic
  script:
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}
    - cp -R ${{ upstream_path }}/. $PREFIX/share/agent-skills/${{ skill }}/

tests:
  - package_contents:
      files:
        - share/agent-skills/${{ skill }}/SKILL.md
      strict: true
  - script:
      - agentskills validate $CONDA_PREFIX/share/agent-skills/${{ skill }}
    requirements:
      run:
        - skills-ref

about:
  summary: Agent skill for efficient queries against a Rerun catalog
  homepage: https://github.com/rerun-io/rerun/tree/main/skills/rerun-catalog-queries
  repository: https://github.com/rerun-io/rerun
  documentation: https://github.com/rerun-io/rerun/blob/main/skills/rerun-catalog-queries/SKILL.md
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
