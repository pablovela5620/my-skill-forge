context:
  skill: rerun-viewer-validation

package:
  name: agent-skill-${{ skill }}
  # Match the Rerun release targeted by this skill; use build bumps for skill revisions.
  version: "0.42.0"

build:
  number: 2
  noarch: generic
  script:
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}/agents
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}/scripts
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}/references
    - cp $RECIPE_DIR/SKILL.md $PREFIX/share/agent-skills/${{ skill }}/SKILL.md
    - cp $RECIPE_DIR/agents/openai.yaml $PREFIX/share/agent-skills/${{ skill }}/agents/openai.yaml
    - cp $RECIPE_DIR/scripts/rrd_to_video.py $PREFIX/share/agent-skills/${{ skill }}/scripts/rrd_to_video.py
    - cp $RECIPE_DIR/scripts/gpu_chrome.sh $PREFIX/share/agent-skills/${{ skill }}/scripts/gpu_chrome.sh
    - cp $RECIPE_DIR/scripts/headless_viewer.py $PREFIX/share/agent-skills/${{ skill }}/scripts/headless_viewer.py
    - cp $RECIPE_DIR/scripts/stills.py $PREFIX/share/agent-skills/${{ skill }}/scripts/stills.py
    - cp $RECIPE_DIR/scripts/rrd_check.py $PREFIX/share/agent-skills/${{ skill }}/scripts/rrd_check.py
    - cp $RECIPE_DIR/references/mcp.md $PREFIX/share/agent-skills/${{ skill }}/references/mcp.md
    - cp $RECIPE_DIR/references/web.md $PREFIX/share/agent-skills/${{ skill }}/references/web.md
    - cp $RECIPE_DIR/references/pages.md $PREFIX/share/agent-skills/${{ skill }}/references/pages.md

requirements:
  # The video branch shells out to ffmpeg — a real dependency, so declare it.
  run:
    - ffmpeg
  # The scripts use the 0.42 viewer-mcp tool names (rerun_get_state, rerun_set_time_cursor, rerun_save_screenshot).
  run_constraints:
    - rerun-sdk >=0.42.0

tests:
  - package_contents:
      files:
        - share/agent-skills/${{ skill }}/SKILL.md
        - share/agent-skills/${{ skill }}/agents/openai.yaml
        - share/agent-skills/${{ skill }}/scripts/rrd_to_video.py
        - share/agent-skills/${{ skill }}/scripts/gpu_chrome.sh
        - share/agent-skills/${{ skill }}/scripts/headless_viewer.py
        - share/agent-skills/${{ skill }}/references/mcp.md
        - share/agent-skills/${{ skill }}/references/web.md
        - share/agent-skills/${{ skill }}/references/pages.md
        - share/agent-skills/${{ skill }}/scripts/stills.py
        - share/agent-skills/${{ skill }}/scripts/rrd_check.py
      strict: true
  - script:
      - agentskills read-properties $CONDA_PREFIX/share/agent-skills/${{ skill }} > /dev/null
    requirements:
      run:
        - skills-ref

about:
  summary: Agent skill for Rerun pixel evidence and Rerun media in pages
  description: |
    Prove what the Rerun viewer rendered, and put recordings into pages:
    - Versions first: writer, viewer and catalog server; what to do on a skew
    - Batch stills (scripts/stills.py) and videos (scripts/rrd_to_video.py) from one headless viewer
    - UI-state checks through `rerun viewer-mcp`
    - Pages: medium (still, video, viewer), size budget and gate, slicing with rrd split, the embed
    - Browser checks of embeds, web viewers and gradio apps in GPU Chrome and WebKit
  homepage: https://github.com/pablovela5620/my-skill-forge
  repository: https://github.com/pablovela5620/my-skill-forge
  documentation: https://github.com/pablovela5620/my-skill-forge
  license: BSD-3-Clause
