context:
  skill: html-artifacts

package:
  name: agent-skill-${{ skill }}
  version: "0.0.2"

build:
  number: 0
  noarch: generic
  script:
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}
    - cp $RECIPE_DIR/SKILL.md $PREFIX/share/agent-skills/${{ skill }}/SKILL.md
    - cp -R $RECIPE_DIR/references $PREFIX/share/agent-skills/${{ skill }}/

tests:
  - package_contents:
      files:
        - share/agent-skills/${{ skill }}/SKILL.md
        - share/agent-skills/${{ skill }}/references/*.md
      strict: true
  - script:
      - agentskills validate $CONDA_PREFIX/share/agent-skills/${{ skill }}
    requirements:
      run:
        - skills-ref

about:
  summary: Agent skill for creating readable single-file HTML artifacts
  description: |
    Create self-contained browser-openable HTML artifacts:
    - Plans, reviews, reports, explainers, diagrams, decks, comparisons, and editors
    - Inline CSS/JS with semantic HTML and responsive layout
    - Impeccable-inspired design quality for readable, useful artifacts
  homepage: https://github.com/pablovela5620/my-skill-forge
  repository: https://github.com/pablovela5620/my-skill-forge
  documentation: https://github.com/pablovela5620/my-skill-forge
  license: BSD-3-Clause
