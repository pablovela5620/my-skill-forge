context:
  skill: delegation

package:
  name: agent-skill-${{ skill }}
  version: "0.0.15"

build:
  number: 0
  noarch: generic
  script:
    - cp $RECIPE_DIR/../../LICENSE $SRC_DIR/LICENSE
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}/references
    - cp $RECIPE_DIR/SKILL.md $PREFIX/share/agent-skills/${{ skill }}/SKILL.md
    - cp $RECIPE_DIR/references/codex.md $PREFIX/share/agent-skills/${{ skill }}/references/codex.md

tests:
  - package_contents:
      files:
        - share/agent-skills/${{ skill }}/SKILL.md
        - share/agent-skills/${{ skill }}/references/codex.md
      strict: true
  - script:
      - agentskills read-properties $CONDA_PREFIX/share/agent-skills/${{ skill }}
    requirements:
      run:
        - skills-ref

about:
  summary: Model routing for delegated work - which model for which task, escalation rules, delegation mechanics
  repository: https://github.com/pablovela5620/my-skill-forge
  license: MIT
  license_file: LICENSE
