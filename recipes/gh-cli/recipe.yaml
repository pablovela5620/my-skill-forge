context:
  skill: gh-cli
  upstream_path: skills/gh-cli/SKILL.md

package:
  name: agent-skill-${{ skill }}
  version: "0.0.2"

source:
  git: https://github.com/github/awesome-copilot
  rev: 68120732cf9e69de8bec6a2b06a57b7463222440
  patches:
    - fix-install.patch
build:
  number: 0
  noarch: generic
  script:
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}
    - cp skills/${{ skill }}/SKILL.md $PREFIX/share/agent-skills/${{ skill }}/SKILL.md
requirements:
  run_constraints:
    - gh >=2.85.0
tests:
  - package_contents:
      files:
        - share/agent-skills/${{ skill }}/SKILL.md
      strict: true
  - script:
      - agentskills validate $CONDA_PREFIX/share/agent-skills/${{ skill }}
    requirements:
      run:
        - skills-ref
about:
  summary: Agent skill for GitHub CLI workflows
  description: |
    GitHub CLI reference skill covering common GitHub workflows:
    - Repositories, issues, pull requests, releases, gists, and organizations
    - GitHub Actions runs, workflows, caches, secrets, and variables
    - Authentication, configuration, extensions, projects, and API access
  homepage: https://github.com/github/awesome-copilot/tree/main/skills/gh-cli
  repository: https://github.com/github/awesome-copilot
  documentation: https://github.com/github/awesome-copilot/tree/main/skills/gh-cli
  license: MIT
  license_file: LICENSE
