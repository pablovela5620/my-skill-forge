context:
  skill: rerun-chunk-processing
  upstream_path: skills/rerun-chunk-processing

package:
  name: agent-skill-${{ skill }}
  version: "0.0.1"

source:
  git: https://github.com/rerun-io/rerun
  rev: edb19a77964eaab1b497a3d7a2aa8700ad7dba7b
  patches:
    - packaging.patch

build:
  number: 0
  noarch: generic
  script:
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}
    - cp -R ${{ upstream_path }}/. $PREFIX/share/agent-skills/${{ skill }}/

tests:
  - package_contents:
      files:
        - share/agent-skills/${{ skill }}/SKILL.md
      strict: true
  - script:
      - agentskills validate $CONDA_PREFIX/share/agent-skills/${{ skill }}
    requirements:
      run:
        - skills-ref

about:
  summary: Agent skill for Rerun chunk streams, readers, lenses, and optimized RRDs
  homepage: https://github.com/rerun-io/rerun/tree/main/skills/rerun-chunk-processing
  repository: https://github.com/rerun-io/rerun
  documentation: https://github.com/rerun-io/rerun/blob/main/skills/rerun-chunk-processing/SKILL.md
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
