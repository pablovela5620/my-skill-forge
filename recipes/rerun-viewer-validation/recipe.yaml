context:
  skill: rerun-viewer-validation

package:
  name: agent-skill-${{ skill }}
  # The version records the minimum Rerun line: viewer MCP first shipped in 0.34.
  version: "0.34.0"

build:
  number: 1
  noarch: generic
  script:
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}/agents
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}/scripts
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}/references
    - cp $RECIPE_DIR/SKILL.md $PREFIX/share/agent-skills/${{ skill }}/SKILL.md
    - cp $RECIPE_DIR/agents/openai.yaml $PREFIX/share/agent-skills/${{ skill }}/agents/openai.yaml
    - cp $RECIPE_DIR/scripts/rrd_to_video.py $PREFIX/share/agent-skills/${{ skill }}/scripts/rrd_to_video.py
    - cp $RECIPE_DIR/references/web.md $PREFIX/share/agent-skills/${{ skill }}/references/web.md

requirements:
  # The video branch shells out to ffmpeg — a real dependency, so declare it.
  run:
    - ffmpeg
  # Viewer MCP first shipped in 0.34; later minor lines remain supported.
  run_constraints:
    - rerun-sdk >=0.34.0

tests:
  - package_contents:
      files:
        - share/agent-skills/${{ skill }}/SKILL.md
        - share/agent-skills/${{ skill }}/agents/openai.yaml
        - share/agent-skills/${{ skill }}/scripts/rrd_to_video.py
        - share/agent-skills/${{ skill }}/references/web.md
      strict: true
  - script:
      - agentskills validate $CONDA_PREFIX/share/agent-skills/${{ skill }}
    requirements:
      run:
        - skills-ref

about:
  summary: Agent skill for proving what the Rerun viewer rendered
  description: |
    Validate Rerun viewer output with evidence, picking the branch by surface:
    - Static render proof via scripted headless ViewerClient screenshots
    - Timeline scrubbing and UI-state checks via the `rerun viewer-mcp` server
      (including a cold-subagent provisioning pattern when the MCP is not registered)
    - Timeline-sweep videos via the bundled scripts/rrd_to_video.py helper
      (headless viewer + MCP set_time/screenshot loop + ffmpeg)
    - Browser deliverables (gradio-rerun apps, embedded WebViewer reports) via
      playwright, with WebGL/theme parity checks and Tailscale Serve links
  homepage: https://github.com/pablovela5620/my-skill-forge
  repository: https://github.com/pablovela5620/my-skill-forge
  documentation: https://github.com/pablovela5620/my-skill-forge
  license: BSD-3-Clause
