context:
  skill: retro
  upstream_path: skills/engineering/retro
package:
  name: agent-skill-${{ skill }}
  version: "0.0.2"
source:
  git: https://github.com/mattpocock/skills
  rev: a7d038f6bf7f01b516408e95e2fb56e0b338fa6f
  patches:
    - use-agent-traces.patch
build:
  number: 1
  noarch: generic
  script:
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}
    - cp -R ${{ upstream_path }}/* $PREFIX/share/agent-skills/${{ skill }}
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}/scripts
    - cp $RECIPE_DIR/scripts/retro_pull.py $PREFIX/share/agent-skills/${{ skill }}/scripts/
tests:
  - package_contents:
      files:
        - share/agent-skills/${{ skill }}/SKILL.md
        - share/agent-skills/${{ skill }}/agents/openai.yaml
        - share/agent-skills/${{ skill }}/scripts/retro_pull.py
        # rattler-build keeps the recipe test file (tests/test_retro_pull.py) for the script test below
        - etc/conda/test-files/agent-skill-${{ skill }}/**
      strict: true
  - script:
      - agentskills read-properties $CONDA_PREFIX/share/agent-skills/${{ skill }} > /dev/null
    requirements:
      run:
        - skills-ref
  - script:
      - python $CONDA_PREFIX/share/agent-skills/${{ skill }}/scripts/retro_pull.py --help > /dev/null
      - python tests/test_retro_pull.py $CONDA_PREFIX/share/agent-skills/${{ skill }}/scripts
    files:
      recipe:
        - tests/test_retro_pull.py
    requirements:
      run:
        - python 3.12.*
        - pyarrow
        - tyro
about:
  summary: Agent skill for retrospectives on coding-agent sessions
  description: |
    Engineering skill, invoked by the user, that reviews coding-agent sessions and
    proposes environment improvements in order of severity: navigation pointers,
    automated checks, coding standards, AGENTS.md size, tool economy, no-ops,
    and information access. Patched to take its evidence from the fleet's
    agent-traces Rerun catalog through a bundled query script (corrections, tool
    errors, retry loops, slow paths), and from the live transcript when the
    catalog lags.
  homepage: https://github.com/mattpocock/skills/tree/main/skills/engineering/retro
  repository: https://github.com/mattpocock/skills
  documentation: https://github.com/mattpocock/skills/tree/main/skills/engineering/retro
  license: MIT
  license_file: LICENSE
