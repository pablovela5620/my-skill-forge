context:
  skill: hf-cli
  upstream_path: skills/hf-cli/SKILL.md
package:
  name: agent-skill-${{ skill }}
  version: "0.0.2"
source:
  git: https://github.com/huggingface/skills
  rev: d7223848c3895fbd447faf2aec73e0a6cdd7fdcd
build:
  number: 0
  noarch: generic
  script:
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}
    - cp skills/${{ skill }}/SKILL.md $PREFIX/share/agent-skills/${{ skill }}/SKILL.md
requirements:
  run_constraints:
    - huggingface_hub >=1.14.0
tests:
  - package_contents:
      files:
        - share/agent-skills/${{ skill }}/SKILL.md
      strict: true
  - script:
      - agentskills validate $CONDA_PREFIX/share/agent-skills/${{ skill }}
    requirements:
      run:
        - skills-ref
about:
  summary: Agent skill for Hugging Face Hub CLI workflows
  description: |
    Hugging Face Hub CLI skill covering common Hub workflows:
    - Authentication, local cache, downloads, uploads, and sync operations
    - Models, datasets, Spaces, repos, collections, papers, and webhooks
    - Buckets, jobs, discussions, pull requests, and inference endpoints
  homepage: https://github.com/huggingface/skills/tree/main/skills/hf-cli
  repository: https://github.com/huggingface/skills
  documentation: https://github.com/huggingface/skills/tree/main/skills/hf-cli
  license: Apache-2.0
  license_file: LICENSE
