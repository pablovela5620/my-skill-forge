context:
  skill: paseo
  upstream_path: skills/paseo
package:
  name: agent-skill-${{ skill }}
  version: "0.0.2"
source:
  git: https://github.com/getpaseo/paseo
  rev: 1198cddf635cfa57767386c734cb91e7c1f52b93
build:
  number: 0
  noarch: generic
  script:
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}
    - cp -R ${{ upstream_path }}/. $PREFIX/share/agent-skills/${{ skill }}/
tests:
  - package_contents:
      files:
        - share/agent-skills/${{ skill }}/SKILL.md
      strict: true
  - script:
      - agentskills read-properties $CONDA_PREFIX/share/agent-skills/${{ skill }} > /dev/null
    requirements:
      run:
        - skills-ref
about:
  summary: Paseo reference for managing projects, workspaces, agents, and schedules
  homepage: https://github.com/getpaseo/paseo/tree/main/skills/paseo
  repository: https://github.com/getpaseo/paseo
  license: Apache-2.0
  license_file: LICENSE
