context:
  skill: rerun-catalog-queries
  upstream_path: skills/rerun-catalog-queries

package:
  name: agent-skill-${{ skill }}
  version: "0.0.2"

source:
  git: https://github.com/rerun-io/rerun
  rev: 5f40dc900aeff92d2a21009595b4b7751366d000
  # Local fix: the fan-out example used a cast filter that its own pushdown rule says is not pushed down.
  # Drop this patch when upstream fixes the example (the build fails when the patch stops applying).
  patches:
    - pushdown-example.patch

build:
  number: 1
  noarch: generic
  script:
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}
    - cp -R ${{ upstream_path }}/. $PREFIX/share/agent-skills/${{ skill }}/

tests:
  - package_contents:
      files:
        - share/agent-skills/${{ skill }}/SKILL.md
      strict: true
  - script:
      - agentskills read-properties $CONDA_PREFIX/share/agent-skills/${{ skill }} > /dev/null
    requirements:
      run:
        - skills-ref

about:
  summary: Agent skill for efficient queries against a Rerun catalog
  homepage: https://github.com/rerun-io/rerun/tree/main/skills/rerun-catalog-queries
  repository: https://github.com/rerun-io/rerun
  documentation: https://github.com/rerun-io/rerun/blob/main/skills/rerun-catalog-queries/SKILL.md
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
