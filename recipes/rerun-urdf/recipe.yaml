context:
  skill: rerun-urdf
  upstream_path: skills/rerun-urdf
package:
  name: agent-skill-${{ skill }}
  version: "0.0.2"
source:
  git: https://github.com/rerun-io/rerun
  rev: 2fbbe044b3f165aa828132d099dd0e19b7c5e7dc
build:
  number: 0
  noarch: generic
  script:
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}
    - cp -R ${{ upstream_path }}/. $PREFIX/share/agent-skills/${{ skill }}/
tests:
  - package_contents:
      files:
        - share/agent-skills/${{ skill }}/SKILL.md
        - share/agent-skills/${{ skill }}/scripts/check_joint_mapping.py
      strict: true
  - script:
      - agentskills read-properties $CONDA_PREFIX/share/agent-skills/${{ skill }} > /dev/null
    requirements:
      run:
        - skills-ref
about:
  summary: Agent skill for Rerun robot models and forward kinematics from URDF
  homepage: https://github.com/rerun-io/rerun/tree/main/skills/rerun-urdf
  repository: https://github.com/rerun-io/rerun
  documentation: https://github.com/rerun-io/rerun/blob/main/skills/rerun-urdf/SKILL.md
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
