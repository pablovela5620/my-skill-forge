context:
  skill: investigate-puffin
  upstream_path: skills/investigate-puffin
package:
  name: agent-skill-${{ skill }}
  version: "0.0.2"
source:
  git: https://github.com/rerun-io/rerun
  rev: a134e2754216c83887c96f3d0be61d1a77f7df86
build:
  number: 0
  noarch: generic
  script:
    - mkdir -p $PREFIX/share/agent-skills/${{ skill }}
    - cp -R ${{ upstream_path }}/. $PREFIX/share/agent-skills/${{ skill }}/
tests:
  - package_contents:
      files:
        - share/agent-skills/${{ skill }}/SKILL.md
        - share/agent-skills/${{ skill }}/compare_traces.py
        - share/agent-skills/${{ skill }}/dump-puffin/.gitignore
        - share/agent-skills/${{ skill }}/dump-puffin/Cargo.lock
        - share/agent-skills/${{ skill }}/dump-puffin/Cargo.toml
        - share/agent-skills/${{ skill }}/dump-puffin/src/main.rs
        - share/agent-skills/${{ skill }}/find_scopes.py
      strict: true
  - script:
      - agentskills read-properties $CONDA_PREFIX/share/agent-skills/${{ skill }} > /dev/null
    requirements:
      run:
        - skills-ref
about:
  summary: Agent skill for analyzing Puffin profiler recordings and comparing traces
  homepage: https://github.com/rerun-io/rerun/tree/main/skills/investigate-puffin
  repository: https://github.com/rerun-io/rerun
  documentation: https://github.com/rerun-io/rerun/blob/main/skills/investigate-puffin/SKILL.md
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
